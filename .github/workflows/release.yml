name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A1C406: ${{ secrets.A1C406 }}
          BF6FC7: ${{ secrets.BF6FC7 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A1C406', '')
          meta_b = os.environ.get('BF6FC7', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- a650040585fdc9309e6d7801b4f879875122 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 94bd38517e19a4d3 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
