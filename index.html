<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Neuroinflammation map</title>
<style>
  body { margin: 0; padding: 16px; font-family: Helvetica, Arial, sans-serif; color: #222; background: #fff; }
</style>
<style>
  /* the maps on the left, the chosen one in the middle as CellDesigner draws it
     (converter/cdrender.py), on the right what the file says about the process or entity clicked */
  .m2 { display: grid; grid-template-columns: 240px minmax(600px, 1fr) 260px; column-gap: 32px; align-items: start;
        width: min(100vw / var(--zoom, 1) - 32px, 2000px); position: relative; left: 50%; transform: translateX(-50%); }
  .m2-nav { grid-column: 1; }
  .m2-main { grid-column: 2; min-width: 0; }
  .m2-side { grid-column: 3; min-width: 0; }
  #m2-info { max-height: calc(100vh / var(--zoom, 1) - 40px); overflow-y: auto; font-size: 14px; line-height: 19px; overflow-wrap: anywhere; }
  #m2-info h3 { font-size: 15px; font-weight: bold; margin: 0 0 4px; }
  #m2-info h4 { font-size: 13px; font-weight: normal; color: #777; margin: 10px 0 2px; }
  #m2-info p { margin: 0 0 3px; }
  #m2-info ul { margin: 0; padding-left: 18px; }
  #m2-info .m2-quiet { color: #777; }
  #m2-info .m2-text { white-space: pre-line; }
  #m2-hl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  #m2-list { max-height: calc(100vh / var(--zoom, 1) - 140px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  @media (max-width: 940px) {
    .m2 { display: block; width: auto; left: 0; transform: none; }
    .m2-nav { margin-bottom: 12px; }
    #m2-list { max-height: 127px; border-bottom: 1px solid #eee; }
    .m2-side { margin-top: 14px; }
    #m2-info { max-height: none; }
  }
  .m2-group { font-size: 14px; line-height: 18px; color: #000; padding: 2px 5px 2px 0; margin-top: 6px; }
  .m2-group:first-child { margin-top: 0; }
  /* flex: none: the list has a max-height, and an item with overflow hidden would otherwise
     shrink to fit it, its highlight cutting the text */
  .m2-group, .m2-item { flex: none; }
  .m2-item { display: block; width: calc(100% - 14px); margin-left: 14px; text-align: left; font-size: 14px; line-height: 18px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m2-item:hover { background: #f3f3f3; }
  .m2-item.m2-on { background: #4183c4; color: #fff; }
  .m2-item:focus { outline: none; }
  .m2-item.m2-bad:not(.m2-on) { color: #c62828; }

  #m2-view { position: relative; width: 100%; height: 504px; min-height: 300px; max-height: calc(100vh / var(--zoom, 1) - 70px); resize: vertical; overflow: hidden; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: grab; touch-action: none; user-select: none; }
  #m2-view.m2-drag { cursor: grabbing; }
  #m2-view:focus, .m2-ctrl button:focus { outline: none; }
  #m2-img { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; }
  #m2-err { position: absolute; left: 16px; top: 40px; right: 16px; font-size: 14px; color: #c62828; }
  .m2-ctrl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
  .m2-ctrl button { font-size: 13px; min-width: 28px; padding: 2px 8px; color: #222; background: #fffffff0; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; }
  .m2-ctrl button:hover { border-color: #4183c4; color: #4183c4; }
  #m2-out, #m2-in { box-sizing: border-box; width: 21px; height: 21px; min-width: 0; padding: 0; }
  #m2-fit { box-sizing: border-box; height: 21px; padding: 0 6px; }
  .m2-top { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; white-space: nowrap; }
  #m2-err.m2-quiet { color: #777; }
  #m2-note { position: absolute; left: 8px; bottom: 8px; font-size: 12px; color: #777; background: #ffffffe0; padding: 0 4px; pointer-events: none; }
  #m2-note:empty { display: none; }
  #m2-zoom { font-size: 12px; color: #666; min-width: 40px; text-align: right; margin-right: 4px; }
  /* full screen: the map alone, as on the Atlas; the arrow keys still go through the list */
  #m2-view:fullscreen { width: 100vw; height: 100vh !important; max-height: none; border: 0; border-radius: 0; resize: none; }
  #m2-view:-webkit-full-screen { width: 100vw; height: 100vh !important; max-height: none; border: 0; border-radius: 0; resize: none; }
  #m2-full { box-sizing: border-box; width: 21px; height: 21px; min-width: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  #m2-full svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* the buttons of the Atlas download row: white, grey edge and text, filled blue on hover */
  .m2-btn { display: inline-flex; align-items: center; font: inherit; font-size: 14px; line-height: 20px; padding: 4px 10px; margin: 4px 4px 0 0; color: #777 !important; background: #fff; border: 1px solid #777; border-radius: 5px; text-decoration: none; cursor: pointer; }
  .m2-btn:hover { background: #4183c4; border-color: #4183c4; color: #fff !important; }
  .m2-btn:focus { outline: none; }
  .m2-btn svg { width: 14px; height: 14px; margin-left: 5px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #m2-downloads { margin: 10px 0 0; display: flex; flex-wrap: wrap; }
  .m2 a { color: #1c47a9; }
  .m2 a:hover, .m2 a:active { color: #1c47a9; }
  /* added proteins: their evidence under the map, one entry each */
  #m2-evidence { margin: 18px 0 0; font-size: 14px; line-height: 20px; }
  #m2-evidence:empty { display: none; }
  #m2-evidence h2 { font-size: 16px; font-weight: normal; margin: 0 0 6px; }
  .m2-legend { color: #555; margin: 0 0 10px; }
  .m2-sw { display: inline-block; width: 22px; height: 12px; border: 1px solid #777; border-radius: 3px; vertical-align: -1px; margin: 0 4px 0 0; }
  .m2-ev { border-top: 1px solid #eee; padding: 8px 0; }
  .m2-ev h3 { font-size: 15px; margin: 0 0 4px; }
  .m2-ev p { margin: 0 0 4px; }
  .m2-ev ol { margin: 4px 0 0; padding-left: 22px; }
  .m2-ev .m2-where { color: #555; }
</style>
</head>
<body>
<div class="m2">
<div class="m2-nav">
<div id="m2-list"></div>
</div>
<div class="m2-main">
<div id="m2-view" tabindex="0">
<img id="m2-img" alt="">
<svg id="m2-hl" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="m2-err"></div>
<div id="m2-note"></div>
<div class="m2-ctrl">
<span id="m2-zoom"></span>
<button type="button" id="m2-out" title="Zoom out">&minus;</button>
<button type="button" id="m2-in" title="Zoom in">+</button>
<button type="button" id="m2-fit">Fit</button>
<button type="button" id="m2-full" title="Full screen" aria-label="Full screen"></button>
</div>
</div>
<div id="m2-downloads"></div>
<div id="m2-evidence"></div>
</div>
<div class="m2-side"><div id="m2-info"></div></div>
</div>
<script>
(function () {
  // A lean copy of the Atlas viewer (as the Colours page's): the map fits the window when
  // chosen, never above the reading size (100%, 0.675 px per unit, as the map pages), the
  // wheel or a pinch zooms at the pointer, a drag moves it, Fit returns. The up and down
  // arrow keys go through the list, ?map=<slug> opens a map.
  var view = document.getElementById('m2-view'), img = document.getElementById('m2-img');
  var err = document.getElementById('m2-err'), list = document.getElementById('m2-list');
  var STANDARD = 0.675, MIN = 0.08, MAX = 4, KEEP = 80;
  var z = STANDARD, tx = 0, ty = 0, moved = false, mapW = 0, mapH = 0, shown = false;
  var maps = [], cur = -1, buttons = [];
  var hl = document.getElementById('m2-hl'), info = document.getElementById('m2-info'), ann = null, downAt = null;
  function pz() { return view.currentCSSZoom || 1; }
  function draw() {
    if (!shown) return;
    var w = mapW * z, h = mapH * z, vw = view.clientWidth, vh = view.clientHeight;
    tx = Math.min(vw - Math.min(KEEP, w), Math.max(Math.min(KEEP, w) - w, tx));
    ty = Math.min(vh - Math.min(KEEP, h), Math.max(Math.min(KEEP, h) - h, ty));
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    hl.setAttribute('width', w);
    hl.setAttribute('height', h);
    hl.setAttribute('viewBox', '0 0 ' + mapW + ' ' + mapH);
    hl.style.transform = img.style.transform;
    document.getElementById('m2-zoom').textContent = Math.round(z / STANDARD * 100) + '%';
  }
  function zoomAt(nz, cx, cy) {
    nz = Math.max(MIN, Math.min(MAX, nz));
    tx = cx - (cx - tx) * nz / z;
    ty = cy - (cy - ty) * nz / z;
    z = nz;
    moved = true;
    draw();
  }
  function fit() {
    if (!shown) return;
    z = Math.min(view.clientWidth / mapW, view.clientHeight / mapH, STANDARD);
    tx = (view.clientWidth - mapW * z) / 2;
    ty = (view.clientHeight - mapH * z) / 2;
    moved = false;
    draw();
  }
  function centre() { return [view.clientWidth / 2, view.clientHeight / 2]; }
  document.getElementById('m2-in').addEventListener('click', function () { var c = centre(); zoomAt(z * 1.25, c[0], c[1]); });
  document.getElementById('m2-out').addEventListener('click', function () { var c = centre(); zoomAt(z / 1.25, c[0], c[1]); });
  document.getElementById('m2-fit').addEventListener('click', fit);
  view.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(z * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), (e.clientX - r.left) / pz(), (e.clientY - r.top) / pz());
  }, { passive: false });
  view.addEventListener('dblclick', function (e) {
    if (e.target.closest('.m2-ctrl')) return;
    var r = view.getBoundingClientRect();
    zoomAt(z * 1.5, (e.clientX - r.left) / pz(), (e.clientY - r.top) / pz());
  });
  var pts = {}, last = null;
  view.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.m2-ctrl')) return;
    var r = view.getBoundingClientRect();
    if (e.clientX > r.right - 18 && e.clientY > r.bottom - 18) return; // the resize handle
    view.setPointerCapture(e.pointerId);
    pts[e.pointerId] = [e.clientX, e.clientY];
    downAt = Object.keys(pts).length === 1 ? [e.clientX, e.clientY] : null;
    last = null;
    view.classList.add('m2-drag');
  });
  view.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var prev = pts[e.pointerId];
    pts[e.pointerId] = [e.clientX, e.clientY];
    var ids = Object.keys(pts);
    if (ids.length === 1) {
      tx += (e.clientX - prev[0]) / pz();
      ty += (e.clientY - prev[1]) / pz();
      moved = true;
      draw();
    } else if (ids.length === 2) {
      var a = pts[ids[0]], b = pts[ids[1]], r = view.getBoundingClientRect();
      var d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (last) zoomAt(z * d / last, ((a[0] + b[0]) / 2 - r.left) / pz(), ((a[1] + b[1]) / 2 - r.top) / pz());
      last = d;
    }
  });
  function release(e) {
    // a click (the pointer moved under 5 px): what is under it opens on the right
    if (e.type === 'pointerup' && downAt && Object.keys(pts).length === 1 && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) pick(e);
    downAt = null;
    delete pts[e.pointerId];
    last = null;
    if (!Object.keys(pts).length) view.classList.remove('m2-drag');
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  // the window's height: 77% of the browser window, as the Atlas's, until its lower edge is dragged
  var autoH = null;
  function viewHeight() {
    if (autoH !== null && view.style.height !== autoH) return;
    autoH = Math.round(Math.max(300, window.innerHeight / pz() * 0.77)) + 'px';
    view.style.height = autoH;
  }
  viewHeight();
  window.addEventListener('resize', viewHeight);
  if (window.ResizeObserver) new ResizeObserver(function () { if (moved) draw(); else fit(); }).observe(view);
  // full screen: the map alone; Esc or the button returns to the page
  var full = document.getElementById('m2-full');
  var FULL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  var EXIT_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
  function isFull() { return (document.fullscreenElement || document.webkitFullscreenElement) === view; }
  function showFull() {
    var on = isFull();
    full.innerHTML = on ? EXIT_ICON : FULL_ICON;
    full.title = on ? 'Exit full screen (Esc)' : 'Full screen';
    full.setAttribute('aria-label', full.title);
  }
  if (view.requestFullscreen || view.webkitRequestFullscreen) {
    showFull();
    full.addEventListener('click', function () {
      if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (view.requestFullscreen || view.webkitRequestFullscreen).call(view);
    });
    var onFull = function () { showFull(); requestAnimationFrame(function () { if (moved) draw(); else fit(); }); };
    document.addEventListener('fullscreenchange', onFull);
    document.addEventListener('webkitfullscreenchange', onFull);
  } else full.style.display = 'none'; // iPhone: no full screen for page elements

  function cdOf(m) { return 'drawn/' + m.slug + '.svg?' + m.svg.slice(0, 8); }

  // What the file says about what is clicked (user, 2026-11-03: only what the file has): a process with what it
  // does, its type, modifiers, references (PubMed, DOI), identifiers and notes; an entity with its type,
  // compartment, identifiers and notes. drawn/<slug>.json, made by scripts/annotations.py at build time.
  var HINT = '<p class="m2-quiet">Click a process or an entity on the map to see its references, identifiers and notes.</p>';
  function e_(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function idList(ids) {
    return '<ul>' + ids.map(function (i) {
      var label = i.db === 'PubMed' ? 'PMID ' + i.id : i.db + ' ' + i.id;
      return '<li><a href="' + e_(i.url) + '" target="_blank" rel="noopener">' + e_(label) + '</a>' +
        (i.rel && i.rel !== 'is' && i.rel !== 'described by' ? ' <span class="m2-quiet">(' + e_(i.rel) + ')</span>' : '') + '</li>';
    }).join('') + '</ul>';
  }
  function section(title, body) { return body ? '<h4>' + title + '</h4>' + body : ''; }
  function nothing(has) { return has ? '' : '<p class="m2-quiet">The file gives no references, identifiers or notes for it.</p>'; }
  function showReaction(r) {
    var refs = r.refs.filter(function (i) { return i.db === 'PubMed' || i.db === 'DOI'; });
    info.innerHTML = '<h3>' + e_(r.what) + '</h3><p class="m2-quiet">' + e_(r.type) + (r.reversible ? ', reversible' : '') + '</p>' +
      section('Modifiers', r.modifiers.length ? '<ul>' + r.modifiers.map(function (m) { return '<li>' + e_(m.by) + ' <span class="m2-quiet">(' + e_(m.how) + ')</span></li>'; }).join('') + '</ul>' : '') +
      section('References', refs.length ? idList(refs) : '') +
      section('Identifiers', r.ids.length ? idList(r.ids) : '') +
      section('Notes', r.notes ? '<p class="m2-text">' + e_(r.notes) + '</p>' : '') +
      nothing(refs.length || r.ids.length || r.notes);
  }
  function showSpecies(s) {
    var refs = s.ids.filter(function (i) { return i.db === 'PubMed' || i.db === 'DOI'; });
    var other = s.ids.filter(function (i) { return refs.indexOf(i) < 0; });
    info.innerHTML = '<h3>' + e_(s.name) + '</h3><p class="m2-quiet">' + e_(s['class'].toLowerCase().replace(/_/g, ' ')) +
      (s.compartment ? ', ' + e_(s.compartment) : '') + '</p>' +
      section('Identifiers', other.length ? idList(other) : '') +
      section('References', refs.length ? idList(refs) : '') +
      section('Notes', s.notes ? '<p class="m2-text">' + e_(s.notes) + '</p>' : '') +
      nothing(s.ids.length || s.notes);
  }
  function clearPick() { hl.innerHTML = ''; info.innerHTML = ann ? HINT : ''; }
  function segDist(p, a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1;
    var t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L));
    return Math.hypot(a[0] + t * dx - p[0], a[1] + t * dy - p[1]);
  }
  function pick(e) {
    if (!ann || !shown || e.target.closest('.m2-ctrl')) return;
    var r = view.getBoundingClientRect();
    var p = [((e.clientX - r.left) / pz() - tx) / z, ((e.clientY - r.top) / pz() - ty) / z];
    // inside an entity's box the smallest such entity, unless the click is on a process square; elsewhere the
    // process whose lines or square are within 6 screen pixels
    var tol = Math.max(2, 6 / z), best = null, bd = tol, onSquare = false;
    var inBox = ann.aliases.find(function (q) { var b = q.box; return p[0] >= b[0] && p[0] <= b[0] + b[2] && p[1] >= b[1] && p[1] <= b[1] + b[3]; });
    ann.reactions.forEach(function (x) {
      if (x.at) { var d = Math.hypot(p[0] - x.at[0], p[1] - x.at[1]) - 4; if (d < bd) { bd = d; best = x; onSquare = true; } }
      if (!inBox) x.lines.forEach(function (l) { for (var k = 1; k < l.length; k++) { var d2 = segDist(p, l[k - 1], l[k]); if (d2 < bd) { bd = d2; best = x; onSquare = false; } } });
    });
    if (best && (!inBox || onSquare)) {
      hl.innerHTML = best.lines.map(function (l) {
        return '<polyline points="' + l.map(function (q) { return q.join(','); }).join(' ') + '" fill="none" stroke="#4183c4" stroke-opacity="0.55" stroke-width="6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
      }).join('') + (best.at ? '<circle cx="' + best.at[0] + '" cy="' + best.at[1] + '" r="9" fill="none" stroke="#4183c4" stroke-width="3" vector-effect="non-scaling-stroke"/>' : '');
      showReaction(best);
      return;
    }
    var a = inBox;
    if (!a) { clearPick(); return; }
    var b = a.box;
    hl.innerHTML = '<rect x="' + (b[0] - 3) + '" y="' + (b[1] - 3) + '" width="' + (b[2] + 6) + '" height="' + (b[3] + 6) + '" rx="6" fill="none" stroke="#4183c4" stroke-width="3" vector-effect="non-scaling-stroke"/>';
    showSpecies(ann.species[a.species]);
  }
  function loadAnn(m) {
    ann = null;
    hl.innerHTML = '';
    info.innerHTML = '';
    if (!m.ann) return;
    fetch('drawn/' + m.slug + '.json?' + m.ann.slice(0, 8)).then(function (r) { return r.json(); }).then(function (d) {
      if (maps[cur] !== m) return;
      ann = d;
      info.innerHTML = HINT;
    }).catch(function () {});
  }
  var note = document.getElementById('m2-note');
  function address() {
    if (cur >= 0) history.replaceState(null, '', '?map=' + maps[cur].slug);
  }
  // the chosen map; reactions cdrender.py cannot draw yet are counted under it
  function show() {
    var m = maps[cur];
    note.textContent = m.notes && m.notes.length ? m.notes.length + (m.notes.length > 1 ? ' reactions' : ' reaction') + ' not drawn' : '';
    loadAnn(m);
    err.className = '';
    if (m.error) {
      shown = false;
      img.removeAttribute('src');
      img.style.display = 'none';
      err.textContent = m.error;
      document.getElementById('m2-zoom').textContent = '';
      return;
    }
    err.textContent = '';
    img.style.display = '';
    mapW = m.width;
    mapH = m.height;
    shown = true;
    img.src = cdOf(m);
    fit();
    // the neighbours load in the background, so the arrow keys show them at once
    [cur - 1, cur + 1].forEach(function (j) {
      var n = maps[j];
      if (n && !n.error) new Image().src = cdOf(n);
    });
  }
  var DL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 15v5h16v-5"/></svg>';
  function choose(i, again) {
    if (i < 0 || i >= maps.length || (i === cur && !again)) return;
    if (cur >= 0 && buttons[cur]) buttons[cur].classList.remove('m2-on');
    cur = i;
    var m = maps[i], b = buttons[i];
    b.classList.add('m2-on');
    b.scrollIntoView({ block: 'nearest' });
    address();
    document.getElementById('m2-downloads').innerHTML =
      '<a class="m2-btn" href="' + encodeURI(m.file) + '" download title="' + m.name + '.xml, sha1 ' + m.sha1 + '">CellDesigner' + DL_ICON + '</a>';
    show();
    showEvidence();
  }
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Escape' && !isFull()) clearPick();
    else if (e.key === 'ArrowDown') choose(cur + 1);
    else if (e.key === 'ArrowUp') choose(cur - 1);
    else if (document.activeElement === view && (e.key === '+' || e.key === '=')) { var c = centre(); zoomAt(z * 1.25, c[0], c[1]); }
    else if (document.activeElement === view && e.key === '-') { var c2 = centre(); zoomAt(z / 1.25, c2[0], c2[1]); }
    else if (document.activeElement === view && e.key === '0') fit();
    else return;
    e.preventDefault();
  });

  function buildList() {
    list.innerHTML = '';
    buttons = [];
    var group = null;
    maps.forEach(function (m, i) {
      if (m.group !== group) {
        group = m.group;
        var g = document.createElement('div');
        g.className = 'm2-group';
        g.textContent = group;
        list.appendChild(g);
      }
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'm2-item' + (m.error ? ' m2-bad' : '');
      b.textContent = m.name;
      b.title = m.error ? m.name + ': ' + m.error : m.name;
      b.addEventListener('click', function () { choose(i); });
      buttons.push(b);
      list.appendChild(b);
    });
  }

  // proteins added to the map (evidence.json): an entry per protein drawn on the chosen map
  var evidence = { proteins: [] };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ref(r) {
    return esc(r.cite) + ' <a href="https://pubmed.ncbi.nlm.nih.gov/' + esc(r.pmid) + '/" target="_blank" rel="noopener">PMID ' + esc(r.pmid) + '</a>';
  }
  function showEvidence() {
    var box = document.getElementById('m2-evidence'), m = maps[cur];
    var here = evidence.proteins.filter(function (p) { return p.maps.indexOf(m.slug) >= 0; });
    if (!here.length) { box.innerHTML = ''; return; }
    var h = '<h2>Proteins added to this map (' + here.length + ')</h2><p class="m2-legend">' +
      (evidence.legend || []).map(function (l) { return '<span class="m2-sw" style="background:' + esc(l.colour) + '"></span>' + esc(l.text); }).join(' &nbsp; ') + '</p>';
    here.forEach(function (p) {
      h += '<div class="m2-ev" id="ev-' + esc(p.name) + '"><h3><span class="m2-sw" style="background:' + esc(p.colour) + '"></span>' + esc(p.name) +
        (p.full_name ? ' <span class="m2-where">(' + esc(p.full_name) + ')</span>' : '') + '</h3>' +
        '<p>' + esc(p.summary) + '</p>' +
        (p.links || []).map(function (l) { return '<p class="m2-where">' + esc(l) + '</p>'; }).join('') +
        '<ol>' + p.refs.map(function (r) { return '<li>' + ref(r) + '</li>'; }).join('') + '</ol></div>';
    });
    box.innerHTML = h;
  }

  fetch('maps.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (data) {
    maps = data;
    buildList();
    var want = new URLSearchParams(location.search).get('map');
    var start = maps.findIndex(function (m) { return m.slug === want; });
    choose(start < 0 ? 0 : start);
    fetch('evidence.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : { proteins: [] }; })
      .then(function (e) { evidence = e; showEvidence(); }).catch(function () {});
  });
})();
</script>
</body>
</html>
